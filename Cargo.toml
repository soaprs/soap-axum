[package]
name = "soaprs-axum"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "Axum HTTP adapter for soaprs"
license = "MIT"
repository = "https://github.com/soaprs/soap-axum"
keywords = ["axum", "soaprs", "http", "clean-architecture"]
categories = ["web-programming::http-server"]
autoexamples = false
exclude = ["examples/**", "reference/**"]

[features]
default = []
auth = ["dep:soaprs-auth", "dep:soaprs-auth-http"]
rate-limit = ["dep:soaprs-rate-limit"]
validation = ["dep:soaprs-validation"]

[dependencies]
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
soaprs-core = { version = "0.6.0", path = "../soaprs/crates/soaprs-core" }
soaprs-http = { version = "0.6.0", path = "../soaprs/crates/soaprs-http" }
soaprs-auth = { version = "0.6.0", path = "../soaprs/crates/soaprs-auth", optional = true }
soaprs-auth-http = { version = "0.6.0", path = "../soaprs/crates/soaprs-auth-http", optional = true }
soaprs-rate-limit = { version = "0.6.0", path = "../soap-rate-limit", optional = true }
soaprs-validation = { version = "0.6.0", path = "../soap-validation", optional = true }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
http-body = "1"
soaprs-contract-tests = { version = "0.6.0", path = "../soaprs/crates/soaprs-contract-tests" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "auth"
path = "examples/auth.rs"

[[example]]
name = "security_telemetry"
path = "examples/security_telemetry.rs"

[[example]]
name = "vertical_slice"
path = "examples/vertical_slice.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
