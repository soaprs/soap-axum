[package]
name = "soaprs-axum"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Axum HTTP adapter for soaprs"
license = "MIT"
repository = "https://github.com/soaprs/soap-axum"
keywords = ["axum", "soaprs", "http", "clean-architecture"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
bytes = "1"
form_urlencoded = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soaprs-core = { version = "0.4.0", path = "../soaprs/crates/soaprs-core" }
soaprs-http = { version = "0.4.0", path = "../soaprs/crates/soaprs-http" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
