name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soap-axum
    steps:
      - uses: actions/checkout@v4
        with:
          path: soap-axum
      - uses: actions/checkout@v4
        with:
          repository: soaprs/soap
          ref: v0.6.0
          path: soaprs
      - uses: actions/checkout@v4
        with:
          repository: soaprs/soap-validation
          ref: v0.6.0
          path: soap-validation
      - uses: actions/checkout@v4
        with:
          repository: soaprs/soap-rate-limit
          ref: v0.6.0
          path: soap-rate-limit
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo rustdoc --all-features -- -D warnings
