version: 2

# Cargo updates are coordinated across soaprs repositories because this crate
# uses sibling path dependencies that are not present in Dependabot's checkout.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
